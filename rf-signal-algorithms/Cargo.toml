[package]
name = "rf-signal-algorithms"
version = "0.1.0"
authors = ["Herbert Wolverson <herberticus@gmail.com>"]
edition = "2021"
rust-version = "1.88"
description = "Rust wrapper for https://github.com/Cloud-RF/Signal-Server signal algorithms."
readme = "README.md"
license = "GPL2"
repository = "https://github.com/thebracket/rf-signals"
keywords = ["rf", "radio", "longley-rice"]
categories = [ "algorithms" ]
publish = false

[dependencies]
num-complex = "0.4"
geo = { version = "0.33", default-features = false }
memmap2 = "0.9"
bytemuck = "1.25"
rayon = "1.12"

[dev-dependencies]
float-cmp = "0.10"
